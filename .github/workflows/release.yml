name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────── Windows ───────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Compilar
        working-directory: desktop
        run: cargo build --release

      - name: Descargar FFmpeg y ADB
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tools | Out-Null

          # FFmpeg (build GPL de gyan.dev)
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe).FullName dist/tools/
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter LICENSE | Select-Object -First 1).FullName licenses/FFMPEG-LICENSE.txt

          # Android Platform-Tools (adb)
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath pt-tmp
          Copy-Item pt-tmp/platform-tools/adb.exe dist/tools/
          Copy-Item pt-tmp/platform-tools/AdbWinApi.dll dist/tools/
          Copy-Item pt-tmp/platform-tools/AdbWinUsbApi.dll dist/tools/

      - name: Preparar carpeta de distribucion
        shell: pwsh
        run: |
          Copy-Item desktop/target/release/TransFEL.exe dist/
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item README.md dist/
          New-Item -ItemType Directory -Force -Path dist/licenses | Out-Null
          Copy-Item licenses/* dist/licenses/

      - name: Portable (zip)
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath TransFEL-${{ github.ref_name }}-windows-x64-portable.zip

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMiVersion="${{ github.ref_name }}" installer/transfel.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            TransFEL-*-windows-x64-portable.zip
            installer/salida/*.exe

  # ──────────────────────────── Linux ────────────────────────────
  # Se compila sobre Ubuntu 22.04 a proposito: el binario necesita una glibc
  # igual o mas antigua que la del equipo donde se ejecute.
  linux:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1   # los runners no traen libfuse2

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libssl-dev file desktop-file-utils

      - name: Compilar
        working-directory: desktop
        run: cargo build --release

      - name: Descargar FFmpeg y ADB
        run: |
          mkdir -p herramientas

          # FFmpeg estatico: no depende de nada del sistema.
          curl -sSL -o ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg herramientas/
          cp ffmpeg-*-amd64-static/GPLv3.txt licenses/FFMPEG-LICENSE.txt || true

          # Android Platform-Tools (adb)
          curl -sSL -o platform-tools.zip \
            https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip -q platform-tools.zip
          cp platform-tools/adb herramientas/

          chmod +x herramientas/*

      - name: Construir el AppImage
        run: |
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin/tools
          mkdir -p $APPDIR/usr/share/applications
          mkdir -p $APPDIR/usr/share/icons/hicolor/256x256/apps

          cp desktop/target/release/TransFEL $APPDIR/usr/bin/transfel
          chmod +x $APPDIR/usr/bin/transfel

          # Junto al ejecutable, igual que en Windows: locate() los encuentra solo.
          cp herramientas/ffmpeg herramientas/adb $APPDIR/usr/bin/tools/

          cp packaging/linux/transfel.desktop $APPDIR/usr/share/applications/
          cp packaging/icono/transfel.png $APPDIR/usr/share/icons/hicolor/256x256/apps/

          cp LICENSE $APPDIR/
          cp -r licenses $APPDIR/

          curl -sSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

          ./linuxdeploy.AppImage \
            --appdir $APPDIR \
            --desktop-file packaging/linux/transfel.desktop \
            --icon-file packaging/icono/transfel.png \
            --output appimage

          # Fuera la herramienta, o el mv de abajo la confundiria con el resultado.
          rm -f linuxdeploy.AppImage

          mv *.AppImage "TransFEL-${{ github.ref_name }}-x86_64.AppImage"

      - name: Empaquetar tar.gz ligero
        run: |
          VERSION="${{ github.ref_name }}"
          DIR="TransFEL-$VERSION-linux-x86_64"

          mkdir -p "$DIR"
          cp desktop/target/release/TransFEL "$DIR/transfel"
          chmod +x "$DIR/transfel"
          cp LICENSE README.md "$DIR/"
          cp -r licenses "$DIR/"
          cp packaging/linux/transfel.desktop "$DIR/"
          cp packaging/icono/transfel.png "$DIR/"
          cp packaging/linux/instalar.sh packaging/linux/desinstalar.sh "$DIR/"
          chmod +x "$DIR"/*.sh

          tar -czf "$DIR.tar.gz" "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            TransFEL-*-x86_64.AppImage
            TransFEL-*-linux-x86_64.tar.gz

  # ─────────────────────────── Publicar ──────────────────────────
  publicar:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/**/*
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            ## TransFEL ${{ github.ref_name }}

            Primera version publica. Transmite la pantalla de tu Android al PC,
            controlala con el raton y transfiere archivos en ambos sentidos,
            por USB o por WiFi.

            ### Descargas

            | Archivo | Para |
            |---|---|
            | `TransFEL-Setup-*.exe` | Windows 10/11 — instalador, incluye ADB y FFmpeg |
            | `TransFEL-*-windows-x64-portable.zip` | Windows sin instalar |
            | `TransFEL-*-x86_64.AppImage` | Linux — un solo archivo, no instala nada |
            | `TransFEL-*-linux-x86_64.tar.gz` | Linux ligero — usa el `adb` y `ffmpeg` del sistema |
            | `TransFEL.apk` | La aplicacion Android (subirla a mano) |

            ### Primeros pasos

            1. Instala la app de escritorio y el APK en el telefono.
            2. Activa **Depuracion USB** en Opciones de desarrollador.
            3. Conecta el cable y abre TransFEL: detecta el dispositivo solo.
            4. Para ir sin cable, pestana **Conexion → Activar conexion WiFi**.

            ### Problemas conocidos

            - Si Android Studio esta reflejando el mismo telefono, las dos
              capturas compiten y la transmision se congela. Cierra una.
            - Algunas apps (bancos sobre todo) bloquean los servicios de
              accesibilidad: ahi el control remoto no responde.
            - Las transferencias no muestran progreso por archivo, solo estado.
            - Los archivos con el mismo nombre se sobrescriben sin preguntar.
